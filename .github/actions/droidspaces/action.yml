name: add droidspaces
description: apply patches and configs for droidspaces support
inputs:
 kernel_version:
  description: 'Kernel version (5.10)'
  required: true

runs:
 using: composite
 steps:
  - name: apply patch and add configs
    shell: bash
    run: |
     cd "$COMMON"
     # ABI: use ABI padding for SYSVIPC This commit allows us to enable CONFIG_SYSVIPC in defconfig without breaking kernel ABI
     patch -p1 --forward < "$KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch" || true

     if [[ "${{ inputs.kernel_version }}" == "5.10" ]]; then
      patch -p1 --forward < "$KERNEL_PATCHES/common/droidspaces/fix_abi_padding_for_posix_mqueue.patch" || true
     fi

     # Patch to fix kernel panic caused by null task queries in user/pid namespaces
     patch -p1 --forward < "$KERNEL_PATCHES/common/droidspaces/0001-Return-ghost-task-if-task-is-null-and-is-requested-b.patch" || true

     # Export IPC NS symbols for binder/containers
     if ! grep -q 'EXPORT_SYMBOL.*put_ipc_ns' "ipc/namespace.c"; then
       echo -e '\nEXPORT_SYMBOL_GPL(put_ipc_ns);' >> "ipc/namespace.c"
     fi
     if ! grep -q 'EXPORT_SYMBOL.*init_ipc_ns' "ipc/msgutil.c"; then
       echo -e '\nEXPORT_SYMBOL_GPL(init_ipc_ns);' >> "ipc/msgutil.c"
     fi

     # Preserve struct cred KABI layout for Samsung KDP / Vendor modules when USER_NS is enabled
     python3 -c '
import re

path = "include/linux/cred.h"
try:
    with open(path, "r") as f:
        content = f.read()

    pattern = r"#ifdef\s+CONFIG_USER_NS\s*\n\s*struct\s+user_namespace\s*\*user_ns;[^\n]*\n\s*struct\s+ucounts\s*\*ucounts;[^\n]*\n#endif\s*\n"
    if re.search(pattern, content, re.DOTALL):
        content = re.sub(pattern, "", content, flags=re.DOTALL)
        
        kabi_pat = r"(ANDROID_KABI_RESERVE\s*\(\s*1\s*\)\s*;[^\n]*\n\s*ANDROID_KABI_RESERVE\s*\(\s*2\s*\)\s*;)"
        replacement = """#ifdef CONFIG_USER_NS
\tstruct user_namespace *user_ns;
\tstruct ucounts *ucounts;
#else
\tANDROID_KABI_RESERVE(1);
\tANDROID_KABI_RESERVE(2);
#endif"""
        if re.search(kabi_pat, content, re.DOTALL):
            content = re.sub(kabi_pat, replacement, content, flags=re.DOTALL)
        else:
            cred_end_pat = r"(\};\s*\n\s*(?:/\*|__randomize_layout|\n))"
            content = re.sub(cred_end_pat, r"#ifdef CONFIG_USER_NS\n\tstruct user_namespace *user_ns;\n\tstruct ucounts *ucounts;\n#endif\n\1", content, count=1)
        
        with open(path, "w") as f:
            f.write(content)
        print("Successfully patched include/linux/cred.h for USER_NS KABI preservation")
except Exception as e:
    print(f"cred.h patch note: {e}")
'

     cd "$GITHUB_WORKSPACE"
     cat >> "$GKI_DEFCONFIG" << 'EOF'
     CONFIG_SYSVIPC=y
     CONFIG_POSIX_MQUEUE=y
     CONFIG_IPC_NS=y
     CONFIG_PID_NS=y
     CONFIG_USER_NS=y
     CONFIG_USER_NS_UNPRIVILEGED=y
     CONFIG_DEVTMPFS=y
     CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
     CONFIG_NETFILTER_XT_TARGET_REJECT=y
     CONFIG_NETFILTER_XT_TARGET_LOG=y
     CONFIG_NETFILTER_XT_MATCH_RECENT=y
     CONFIG_IP_SET=y
     CONFIG_IP_SET_HASH_IP=y
     CONFIG_IP_SET_HASH_NET=y
     CONFIG_NETFILTER_XT_SET=y
     EOF
